syntax = "proto3";

package iam.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mateusz-kacpura/integra-enterprise/integra-proto/gen/go/iam/v1;iamv1";

// IdentityService provides authentication, authorization, role and license resolution.
service IdentityService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetUserBatch(GetUserBatchRequest) returns (GetUserBatchResponse);
  rpc GetUserRoles(GetUserRolesRequest) returns (GetUserRolesResponse);
  rpc GetLicense(GetLicenseRequest) returns (GetLicenseResponse);
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_SUSPENDED = 2;
  USER_STATUS_LOCKED = 3;
  USER_STATUS_DELETED = 4;
}

enum LicenseStatus {
  LICENSE_STATUS_UNSPECIFIED = 0;
  LICENSE_STATUS_ACTIVE = 1;
  LICENSE_STATUS_EXPIRED = 2;
  LICENSE_STATUS_SUSPENDED = 3;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  message Claims {
    string user_id = 1;
    string email = 2;
    google.protobuf.Timestamp issued_at = 3;
    google.protobuf.Timestamp expires_at = 4;
    repeated string scopes = 5;
  }
  Claims claims = 2;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string id = 1;
  string email = 2;
  string phone = 3;
  UserStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetUserBatchRequest {
  // Maximum 100 user IDs allowed per batch request.
  repeated string user_ids = 1;
}

message GetUserBatchResponse {
  repeated GetUserResponse users = 1;
}

message GetUserRolesRequest {
  string user_id = 1;
}

message RoleInfo {
  string role_id = 1;
  string role_name = 2;
  repeated string permissions = 3;
}

message OrgRoleInfo {
  string org_id = 1;
  string org_name = 2;
  RoleInfo role = 3;
}

message GetUserRolesResponse {
  repeated OrgRoleInfo org_roles = 1;
  repeated RoleInfo global_roles = 2;
}

message GetLicenseRequest {
  string user_id = 1;
  string product = 2;
  string org_id = 3;
}

message GetLicenseResponse {
  string license_id = 1;
  string user_id = 2;
  string plan = 3;
  LicenseStatus status = 4;
  google.protobuf.Timestamp valid_from = 5;
  google.protobuf.Timestamp valid_until = 6;
  repeated string features = 7;
}

message CheckPermissionRequest {
  string user_id = 1;
  string permission = 2;
  string org_id = 3;
}

message CheckPermissionResponse {
  bool allowed = 1;
}
