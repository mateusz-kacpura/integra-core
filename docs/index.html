    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('integra_doc_lang', lang);
      document.getElementById('btn-pl').classList.toggle('active', lang === 'pl');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      renderNav();
      
      // Load corresponding README
      const defaultDoc = lang === 'pl' ? 'pl/README.md' : 'en/README.md';
      loadDoc(defaultDoc);
    }

    function renderNav() {
      const navContainer = document.getElementById('nav-tree');
      const sections = navStructure[currentLang];
      let html = '';

      sections.forEach(sec => {
        html += `<div class="nav-section-title">${sec.title}</div>`;
        sec.items.forEach(item => {
          const isActive = item.path === currentDocPath ? 'active' : '';
          html += `<a class="nav-item ${isActive}" onclick="loadDoc('${item.path}')">${item.title}</a>`;
        });
      });

      navContainer.innerHTML = html;
    }

    async function loadDoc(relativePath) {
      currentDocPath = relativePath;
      renderNav();

      const container = document.getElementById('doc-content');
      container.innerHTML = '<div style="text-align: center; padding: 40px;"><p style="color: #60a5fa;">Ładowanie treści...</p></div>';

      try {
        let md = '';
        if (typeof DOCS_STORE !== 'undefined' && DOCS_STORE && DOCS_STORE[relativePath] !== undefined) {
          md = DOCS_STORE[relativePath];
        } else {
          const res = await fetch(relativePath);
          if (!res.ok) throw new Error('Nie udało się pobrać pliku: ' + res.statusText);
          md = await res.text();
        }

        // Process markdown: rewrite relative markdown links so they trigger loadDoc
        const renderer = new marked.Renderer();
        const origLink = renderer.link.bind(renderer);
        renderer.link = function(href, title, text) {
          if (href && !href.startsWith('http') && !href.startsWith('#') && href.endsWith('.md')) {
            // Compute resolved path relative to currentDocPath
            const currentParts = relativePath.split('/');
            currentParts.pop();
            const targetParts = href.split('/');
            const resolved = [];
            for (const part of [...currentParts, ...targetParts]) {
              if (part === '..') resolved.pop();
              else if (part !== '.') resolved.push(part);
            }
            const fullTarget = resolved.join('/');
            return `<a href="javascript:void(0)" onclick="loadDoc('${fullTarget}')">${text}</a>`;
          }
          return origLink(href, title, text);
        };

        marked.setOptions({
          renderer: renderer,
          highlight: function(code, lang) {
            if (typeof hljs !== 'undefined' && hljs && lang && hljs.getLanguage(lang)) {
              try {
                return hljs.highlight(code, { language: lang }).value;
              } catch (_) {}
            }
            if (typeof hljs !== 'undefined' && hljs) {
              try {
                return hljs.highlightAuto(code).value;
              } catch (_) {}
            }
            return code;
          }
        });

        container.innerHTML = marked.parse(md);

        // Render any Mermaid diagrams
        const codeBlocks = container.querySelectorAll('pre code.language-mermaid');
        codeBlocks.forEach((block, idx) => {
          const pre = block.parentElement;
          const mermaidDiv = document.createElement('div');
          mermaidDiv.className = 'mermaid';
          mermaidDiv.textContent = block.textContent;
          pre.replaceWith(mermaidDiv);
        });

        if (typeof mermaid !== 'undefined' && mermaid) {
          try {
            mermaid.run();
          } catch (mErr) {
            console.warn('Mermaid rendering error:', mErr);
          }
        }
        window.scrollTo(0, 0);
      } catch (err) {
        let hint = '';
        if (window.location.protocol === 'file:') {
          hint = '<p style="margin-top: 10px; font-size: 12px; color: #94a3b8;">Wskazówka: Plik otwarty w protokole file://. Zasób nie został znaleziony w magazynie offline.</p>';
        }
        container.innerHTML = `<div style="padding: 20px; color: #f87171;"><h3>Błąd ładowania</h3><p>${err.message}</p>${hint}</div>`;
      }
    }

    function handleSearch(query) {
      const resultsDiv = document.getElementById('search-results');
      const navTree = document.getElementById('nav-tree');
      
      if (!query || query.trim().length < 2) {
        resultsDiv.style.display = 'none';
        navTree.style.display = 'flex';
        return;
      }

      const q = query.toLowerCase().trim();
      const matches = searchIndex.filter(d => 
        (d.lang === currentLang) && 
        (d.title.toLowerCase().includes(q) || d.content.toLowerCase().includes(q))
      ).slice(0, 8);

      if (matches.length === 0) {
        resultsDiv.innerHTML = '<div style="padding: 12px; font-size: 12px; color: #64748b;">Brak wyników / No results found</div>';
      } else {
        let h = '';
        matches.forEach(m => {
          h += `
            <div class="search-item" onclick="loadDoc('${m.path}')">
              <div class="search-title">${m.title}</div>
              <div class="search-snippet">${m.content.slice(0, 110)}...</div>
            </div>
          `;
        });
        resultsDiv.innerHTML = h;
      }

      resultsDiv.style.display = 'flex';
      navTree.style.display = 'none';
    }

    // Initial setup
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#0b1120',
        primaryColor: '#3b82f6',
        primaryTextColor: '#f8fafc',
        primaryBorderColor: '#60a5fa',
        lineColor: '#94a3b8'
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      setLanguage(currentLang);
    });
  </script>
